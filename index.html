<!DOCTYPE html>
<html lang="en">
<head>
<title>Sub Meter Billing System</title>

<style>
/* =========================
   THEME VARIABLES
========================= */
:root {
    --bg: #000814;
    --text: white;
    --card: rgba(10,15,30,0.95);
    --accent: #00e5ff;
    --input: #0d1424;
}

/* LIGHT MODE */
.light-mode {
    --bg: #f4f6ff;
    --text: #111;
    --card: white;
    --accent: #0066ff;
    --input: #e9eefc;
}

body {
    font-family: Arial;
    margin: 0;
    padding: 20px;
    background: var(--bg);
    color: var(--text);
    transition: 0.3s;
}

/* lightning background */
body::before {
    content: "";
    position: fixed;
    width: 100%;
    height: 100%;
    background: linear-gradient(120deg, transparent, rgba(0,200,255,0.08), transparent);
    animation: flash 6s infinite;
    pointer-events: none;
}

@keyframes flash {
    0%,100% { opacity: 0.1; }
    25% { opacity: 0.6; }
    30% { opacity: 0.1; }
    60% { opacity: 0.5; }
}

.container {
    max-width: 750px;
    margin: auto;
    background: var(--card);
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 0 20px rgba(0,180,255,0.3);
    transition: 0.3s;
}

h2 {
    text-align: center;
    color: var(--accent);
}

h3 {
    color: var(--accent);
    border-left: 4px solid var(--accent);
    padding-left: 8px;
}

/* ✅ ADDED ONLY (NO CHANGES TO YOUR ORIGINAL CSS) */
h3::after {
    content: "";
    display: block;
    height: 2px;
    width: 100%;
    margin-top: 5px;
    background: var(--accent);
    opacity: 0.3;
}

/* optional improvement ONLY */
h2 {
    text-align: center;
}

input {
    width: 100%;
    padding: 10px;
    margin: 5px 0;
    border: none;
    border-radius: 5px;
    background: var(--input);
    color: var(--text);
}

button {
    width: 100%;
    padding: 10px;
    background: linear-gradient(90deg, #0066ff, #00e5ff);
    border: none;
    color: white;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
}

.record {
    background: var(--input);
    padding: 10px;
    margin: 5px 0;
    border-radius: 8px;
    border-left: 3px solid var(--accent);
}

/* toggle button */
.toggle {
    position: fixed;
    top: 10px;
    right: 10px;
    padding: 8px 12px;
    border-radius: 20px;
    background: var(--accent);
    color: black;
    cursor: pointer;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="toggle" onclick="toggleMode()">🌙 / ☀️ Mode</div>

<div class="container">

<h2>Electric Billing System</h2>

<form onsubmit="calculate(); return false;">

<h3>Main Bill</h3>
<input id="totalKWH" type="number" step="any" placeholder="Total KWH Used" required min="0">
<input id="totalAmount" type="number" step="any" placeholder="Total Amount Due" required min="0">

<h3>Sub-Meter Record</h3>
<input id="oldM" type="number" step="any" placeholder="Old Meter (Melissa)" required min="0">
<input id="newM" type="number" step="any" placeholder="New Meter (Melissa)" required min="0">

<input id="oldMark" type="number" step="any" placeholder="Old Meter (Mark)" min="0">
<input id="newMark" type="number" step="any" placeholder="New Meter (Mark)" min="0">

<button type="submit">Calculate & Save</button>

</form>

<div id="output"></div>
<div id="undoBox"></div>

<h3>📜 History</h3>
<div id="history"></div>

</div>

</body>
</html>
