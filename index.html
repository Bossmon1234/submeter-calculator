<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
    getFirestore,
    doc,
    setDoc,
    getDoc,
    deleteDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyCQXv0_MS3aSt0eAVjF7K0197eCrigb0is",
    authDomain: "sub-meter-calculator-6875f.firebaseapp.com",
    projectId: "sub-meter-calculator-6875f",
    storageBucket: "sub-meter-calculator-6875f.appspot.com",
    messagingSenderId: "1096909978301",
    appId: "1:1096909978301:web:41195a8b49133cadba15d4"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

function monthKey() {
    return new Date().toISOString().slice(0, 7);
}

// =======================
// CALCULATE + SAVE STRUCTURED DATA
// =======================
window.calculate = async function () {

    let totalKWH = parseFloat(document.getElementById("totalKWH").value);
    let totalAmount = parseFloat(document.getElementById("totalAmount").value);
    let oldM = parseFloat(document.getElementById("oldM").value);
    let newM = parseFloat(document.getElementById("newM").value);

    if (!totalKWH || !totalAmount || !oldM || !newM) {
        alert("Fill all fields");
        return;
    }

    let pricePerKWH = totalAmount / totalKWH;

    let melissaKWH = newM - oldM;
    let melissaCost = melissaKWH * pricePerKWH;

    let segKWH = totalKWH - melissaKWH;
    let segCost = totalAmount - melissaCost;

    const month = monthKey();

    // SAVE STRUCTURED BY MONTH
    await setDoc(doc(db, "history", month), {
        month,
        pricePerKWH,
        melissa: {
            kwh: melissaKWH,
            cost: melissaCost
        },
        segundina: {
            kwh: segKWH,
            cost: segCost
        }
    });

    document.getElementById("output").innerHTML = `
        <b>Price per KWH:</b> ₱${pricePerKWH.toFixed(2)}<br><br>
        <b>Melissa:</b> ${melissaKWH.toFixed(2)} kWh - ₱${melissaCost.toFixed(2)}<br>
        <b>Segundina:</b> ${segKWH.toFixed(2)} kWh - ₱${segCost.toFixed(2)}
    `;

    loadHistory();
};

// =======================
// LOAD DATA (CLEAN + STRUCTURED)
// =======================
window.loadHistory = async function () {

    const month = monthKey();
    const snap = await getDoc(doc(db, "history", month));

    let mHTML = "";
    let sHTML = "";

    if (snap.exists()) {
        const d = snap.data();

        mHTML = `
        <div class="record">
            📅 ${d.month}<br>
            ⚡ ${d.melissa.kwh} kWh<br>
            💰 ₱${d.melissa.cost}<br>
            <button onclick="undo()">Undo</button>
        </div>`;

        sHTML = `
        <div class="record">
            📅 ${d.month}<br>
            ⚡ ${d.segundina.kwh} kWh<br>
            💰 ₱${d.segundina.cost}<br>
            <button onclick="undo()">Undo</button>
        </div>`;
    }

    document.getElementById("melissaHistory").innerHTML = mHTML;
    document.getElementById("segundinaHistory").innerHTML = sHTML;
};

// =======================
// UNDO (DELETE MONTH DATA)
// =======================
window.undo = async function () {
    const month = monthKey();
    await deleteDoc(doc(db, "history", month));
    loadHistory();
};

loadHistory();
</script>
