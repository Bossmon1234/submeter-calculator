<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { 
    getFirestore, 
    collection, 
    addDoc, 
    getDocs,
    deleteDoc,
    doc,
    query,
    where
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyCQXv0_MS3aSt0eAVjF7K0197eCrigb0is",
    authDomain: "sub-meter-calculator-6875f.firebaseapp.com",
    projectId: "sub-meter-calculator-6875f",
    storageBucket: "sub-meter-calculator-6875f.appspot.com",
    messagingSenderId: "1096909978301",
    appId: "1:1096909978301:web:41195a8b49133cadba15d4"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ========================
// SAVE HISTORY (WITH MONTH LIMIT)
// ========================
window.saveHistory = async function(data) {

    // get month key (YYYY-MM)
    const monthKey = new Date().toISOString().slice(0, 7);

    // check if already exists
    const q = query(collection(db, "history"), where("monthKey", "==", monthKey));
    const snap = await getDocs(q);

    if (!snap.empty) {
        alert("You already have a record for this month!");
        return;
    }

    await addDoc(collection(db, "history"), {
        ...data,
        monthKey
    });
};

// ========================
// CALCULATE
// ========================
window.calculate = async function() {

    let totalKWH = parseFloat(document.getElementById("totalKWH").value);
    let totalAmount = parseFloat(document.getElementById("totalAmount").value);
    let oldM = parseFloat(document.getElementById("oldM").value);
    let newM = parseFloat(document.getElementById("newM").value);

    let date = new Date().toLocaleDateString();
    let monthKey = new Date().toISOString().slice(0, 7);

    let pricePerKWH = totalAmount / totalKWH;

    let melissaKWH = newM - oldM;
    let melissaCost = melissaKWH * pricePerKWH;

    let segKWH = totalKWH - melissaKWH;
    let segCost = totalAmount - melissaCost;

    await addDoc(collection(db, "history"), {
        date,
        monthKey,
        pricePerKWH,
        melissaKWH,
        melissaCost,
        segKWH,
        segCost
    });

    document.getElementById("output").innerHTML = `
        <b>Price per KWH:</b> ₱${pricePerKWH.toFixed(2)}<br><br>
        <b>Melissa:</b> ${melissaKWH.toFixed(2)} kWh - ₱${melissaCost.toFixed(2)}<br>
        <b>Segundina:</b> ${segKWH.toFixed(2)} kWh - ₱${segCost.toFixed(2)}
    `;

    loadHistory();
};

// ========================
// DELETE (UNDO)
// ========================
window.deleteRecord = async function(id) {
    await deleteDoc(doc(db, "history", id));
    loadHistory();
};

// ========================
// LOAD HISTORY
// ========================
window.loadHistory = async function() {

    const snapshot = await getDocs(collection(db, "history"));

    let melissaHTML = "";
    let segundinaHTML = "";

    snapshot.forEach(docSnap => {
        const d = docSnap.data();
        const id = docSnap.id;

        melissaHTML += `
            <div class="record">
                📅 ${d.date}<br>
                ⚡ ${d.melissaKWH} kWh<br>
                💰 ₱${d.melissaCost}<br>
                <button onclick="deleteRecord('${id}')" style="background:red;">Undo</button>
            </div>
        `;

        segundinaHTML += `
            <div class="record">
                📅 ${d.date}<br>
                ⚡ ${d.segKWH} kWh<br>
                💰 ₱${d.segCost}<br>
                <button onclick="deleteRecord('${id}')" style="background:red;">Undo</button>
            </div>
        `;
    });

    document.getElementById("melissaHistory").innerHTML = melissaHTML;
    document.getElementById("segundinaHistory").innerHTML = segundinaHTML;
};

loadHistory();
</script>
