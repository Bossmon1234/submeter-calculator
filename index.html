<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { 
    getFirestore, 
    collection, 
    addDoc, 
    getDocs,
    deleteDoc,
    doc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyCQXv0_MS3aSt0eAVjF7K0197eCrigb0is",
    authDomain: "sub-meter-calculator-6875f.firebaseapp.com",
    projectId: "sub-meter-calculator-6875f",
    storageBucket: "sub-meter-calculator-6875f.appspot.com",
    messagingSenderId: "1096909978301",
    appId: "1:1096909978301:web:41195a8b49133cadba15d4"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let historyData = [];


// =====================
// SAVE
// =====================
window.saveHistory = async function(data) {
    await addDoc(collection(db, "history"), data);
};


// =====================
// CALCULATE
// =====================
window.calculate = async function() {

    let totalKWH = parseFloat(document.getElementById("totalKWH").value);
    let totalAmount = parseFloat(document.getElementById("totalAmount").value);
    let oldM = parseFloat(document.getElementById("oldM").value);
    let newM = parseFloat(document.getElementById("newM").value);

    if (isNaN(totalKWH) || isNaN(totalAmount) || isNaN(oldM) || isNaN(newM)) {
        alert("Please fill all fields correctly!");
        return;
    }

    let date = new Date().toLocaleDateString();
    let pricePerKWH = totalAmount / totalKWH;

    let melissaKWH = newM - oldM;
    let melissaCost = melissaKWH * pricePerKWH;

    let segKWH = totalKWH - melissaKWH;
    let segCost = totalAmount - melissaCost;

    await saveHistory({
        date,
        pricePerKWH,
        melissaKWH,
        melissaCost,
        segKWH,
        segCost
    });

    document.getElementById("output").innerHTML = `
        <b>Price per KWH:</b> ₱${pricePerKWH.toFixed(2)}<br><br>
        <b>Melissa:</b> ${melissaKWH.toFixed(2)} kWh - ₱${melissaCost.toFixed(2)}<br>
        <b>Segundina:</b> ${segKWH.toFixed(2)} kWh - ₱${segCost.toFixed(2)}
    `;

    loadHistory();
};


// =====================
// LOAD HISTORY (WITH DELETE BUTTON)
// =====================
window.loadHistory = async function() {

    const snapshot = await getDocs(collection(db, "history"));

    historyData = [];

    snapshot.forEach(d => {
        const data = d.data();
        historyData.push({ ...data, id: d.id });
    });

    let html = "";

    historyData.forEach(d => {

        html += `
            <div class="record">
                📅 ${d.date}<br>
                ⚡ Melissa: ${d.melissaKWH} kWh | ₱${d.melissaCost}<br>
                ⚡ Segundina: ${d.segKWH} kWh | ₱${d.segCost}<br><br>

                <button onclick="deleteRecord('${d.id}')"
                style="background:red;color:white;border:none;padding:6px;border-radius:5px;">
                    Delete (PIN required)
                </button>
            </div>
        `;
    });

    document.getElementById("melissaHistory").innerHTML = html;
    document.getElementById("segundinaHistory").innerHTML = html;
};


// =====================
// DELETE WITH PIN
// =====================
window.deleteRecord = async function(id) {

    let pin = prompt("Enter PIN to delete:");

    if (pin !== "120402") {
        alert("Wrong PIN!");
        return;
    }

    await deleteDoc(doc(db, "history", id));

    alert("Deleted successfully!");

    loadHistory();
};


// =====================
// AUTO LOAD
// =====================
window.addEventListener("DOMContentLoaded", () => {
    loadHistory();
});
</script>
