<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  // 🔥 YOUR FIREBASE CONFIG (you already provided this)
  const firebaseConfig = {
    apiKey: "AIzaSyCQXv0_MS3aSt0eAVjF7K0197eCrigb0is",
    authDomain: "sub-meter-calculator-6875f.firebaseapp.com",
    databaseURL: "https://sub-meter-calculator-6875f-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "sub-meter-calculator-6875f",
    storageBucket: "sub-meter-calculator-6875f.firebasestorage.app",
    messagingSenderId: "1096909978301",
    appId: "1:1096909978301:web:41195a8b49133cadba15d4",
    measurementId: "G-84N5V71EGR"
  };

  // 🔵 Initialize Firebase
  const app = initializeApp(firebaseConfig);

  // 🔵 Connect to Firestore
  const db = getFirestore(app);

  // 🧠 FUNCTION: Save calculator history
  async function saveHistory(calculation, result) {
    try {
      await addDoc(collection(db, "history"), {
        calculation: calculation,
        result: result,
        time: new Date()
      });

      console.log("Saved to Firestore!");
    } catch (error) {
      console.error("Error saving:", error);
    }
  }

  // 🧪 TEST (you can remove later)
  saveHistory("5 + 5", 10);

</script>
