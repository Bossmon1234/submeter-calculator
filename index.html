<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sub Meter Billing System</title>

<style>
body {
    font-family: Arial;
    background: #f4f4f4;
    padding: 20px;
}

.container {
    background: white;
    padding: 20px;
    border-radius: 10px;
    max-width: 750px;
    margin: auto;
}

input {
    width: 100%;
    padding: 8px;
    margin: 5px 0 10px;
}

button {
    width: 100%;
    padding: 10px;
    background: green;
    color: white;
    border: none;
    margin-top: 5px;
    cursor: pointer;
}

.tabs button {
    width: 33%;
    background: #333;
}

.tab {
    display: none;
    margin-top: 15px;
}

.active {
    display: block;
}

.record {
    background: #e8f5e9;
    padding: 8px;
    margin: 5px 0;
    border-radius: 5px;
}
</style>
</head>

<body>

<div class="container">
<h2>Sub Meter Billing System</h2>

<div class="tabs">
<button onclick="openTab('calc')">Calculator</button>
<button onclick="openTab('melissa')">Melissa History</button>
<button onclick="openTab('segundina')">Segundina History</button>
</div>

<div id="calc" class="tab active">

<h3>Main Bill</h3>
<input id="totalKWH" type="number" placeholder="Total KWH Used">
<input id="totalAmount" type="number" placeholder="Total Amount Due">

<h3>Sub-meter Record</h3>
<input id="oldM" type="number" placeholder="Old Meter">
<input id="newM" type="number" placeholder="New Meter">

<button onclick="calculate()">Calculate & Save</button>

<div id="output"></div>
</div>

<div id="melissa" class="tab">
<h3>Melissa Monthly History</h3>
<div id="melissaHistory"></div>
</div>

<div id="segundina" class="tab">
<h3>Segundina History</h3>
<div id="segundinaHistory"></div>
</div>

</div>

<script>
function openTab(tab) {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    document.getElementById(tab).classList.add("active");
}
</script>

<!-- 🔥 FIREBASE FULL FIX -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { 
    getFirestore, 
    collection, 
    addDoc, 
    getDocs 
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyCQXv0_MS3aSt0eAVjF7K0197eCrigb0is",
    authDomain: "sub-meter-calculator-6875f.firebaseapp.com",
    projectId: "sub-meter-calculator-6875f",
    storageBucket: "sub-meter-calculator-6875f.appspot.com",
    messagingSenderId: "1096909978301",
    appId: "1:1096909978301:web:41195a8b49133cadba15d4"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let melissaData = [];
let segundinaData = [];

// 🔥 SAVE DATA
window.saveHistory = async function(data) {
    await addDoc(collection(db, "history"), data);
};

// 🔥 CALCULATE
window.calculate = async function() {

    let totalKWH = parseFloat(document.getElementById("totalKWH").value);
    let totalAmount = parseFloat(document.getElementById("totalAmount").value);
    let oldM = parseFloat(document.getElementById("oldM").value);
    let newM = parseFloat(document.getElementById("newM").value);

    let date = new Date().toLocaleDateString();

    let pricePerKWH = totalAmount / totalKWH;

    let melissaKWH = newM - oldM;
    let melissaCost = melissaKWH * pricePerKWH;

    let segKWH = totalKWH - melissaKWH;
    let segCost = totalAmount - melissaCost;

    await saveHistory({
        date,
        pricePerKWH,
        melissaKWH,
        melissaCost,
        segKWH,
        segCost
    });

    document.getElementById("output").innerHTML = `
        <b>Price per KWH:</b> ₱${pricePerKWH.toFixed(2)}<br><br>
        <b>Melissa:</b> ${melissaKWH.toFixed(2)} kWh - ₱${melissaCost.toFixed(2)}<br>
        <b>Segundina:</b> ${segKWH.toFixed(2)} kWh - ₱${segCost.toFixed(2)}
    `;

    loadHistory();
};

// 🔥 LOAD DATA (THIS FIXES PHONE/LAPTOP SYNC)
window.loadHistory = async function() {

    const snapshot = await getDocs(collection(db, "history"));

    melissaData = [];
    segundinaData = [];

    snapshot.forEach(doc => {
        const d = doc.data();

        melissaData.push(d);
        segundinaData.push(d);
    });

    document.getElementById("melissaHistory").innerHTML =
        melissaData.map(d => `
            <div class="record">
                📅 ${d.date}<br>
                ⚡ ${d.melissaKWH} kWh<br>
                💰 ₱${d.melissaCost}
            </div>
        `).join("");

    document.getElementById("segundinaHistory").innerHTML =
        segundinaData.map(d => `
            <div class="record">
                📅 ${d.date}<br>
                ⚡ ${d.segKWH} kWh<br>
                💰 ₱${d.segCost}
            </div>
        `).join("");
};

loadHistory();
</script>

</body>
</html>
