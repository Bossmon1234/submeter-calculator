<!DOCTYPE html>
<html lang="en">
<head>
<title>Sub Meter Billing System</title>

<style>
:root {
    --bg: #000814;
    --text: white;
    --card: rgba(10,15,30,0.95);
    --accent: #00e5ff;
    --input: #0d1424;
}

.light-mode {
    --bg: #f4f6ff;
    --text: #111;
    --card: white;
    --accent: #0066ff;
    --input: #e9eefc;
}

body {
    font-family: Arial;
    margin: 0;
    padding: 20px;
    background: var(--bg);
    color: var(--text);
    transition: 0.3s;
}

body::before {
    content: "";
    position: fixed;
    width: 100%;
    height: 100%;
    background: linear-gradient(120deg, transparent, rgba(0,200,255,0.08), transparent);
    animation: flash 6s infinite;
    pointer-events: none;
}

@keyframes flash {
    0%,100% { opacity: 0.1; }
    25% { opacity: 0.6; }
    30% { opacity: 0.1; }
    60% { opacity: 0.5; }
}

.container {
    max-width: 750px;
    margin: auto;
    background: var(--card);
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 0 20px rgba(0,180,255,0.3);
}

h2 {
    text-align: center;
    color: var(--accent);
}

h3 {
    color: var(--accent);
    border-left: 4px solid var(--accent);
    padding-left: 8px;
}

input {
    width: 100%;
    padding: 10px;
    margin: 5px 0;
    border: none;
    border-radius: 5px;
    background: var(--input);
    color: var(--text);
}

button {
    width: 100%;
    padding: 10px;
    background: linear-gradient(90deg, #0066ff, #00e5ff);
    border: none;
    color: white;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
}

.record {
    background: var(--input);
    padding: 10px;
    margin: 5px 0;
    border-radius: 8px;
    border-left: 3px solid var(--accent);
}

.toggle {
    position: fixed;
    top: 10px;
    right: 10px;
    padding: 8px 12px;
    border-radius: 20px;
    background: var(--accent);
    color: black;
    cursor: pointer;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="toggle" onclick="toggleMode()">🌙 / ☀️ Mode</div>

<div class="container">

<h2>Electric Billing System</h2>

<form onsubmit="calculate(); return false;">

<h3>Main Meter</h3>
<input id="totalKWH" type="number" step="any" placeholder="Total KWH Used" required min="0">
<input id="totalAmount" type="number" step="any" placeholder="Total Amount Due" required min="0">

<h3>Sub-Meter Record</h3>
<input id="oldM" type="number" step="any" placeholder="Old Meter (Melissa)" required min="0">
<input id="newM" type="number" step="any" placeholder="New Meter (Melissa)" required min="0">
    
<hr class="separator">
    
<input id="oldMark" type="number" step="any" placeholder="Old Meter (Mark)" min="0">
<input id="newMark" type="number" step="any" placeholder="New Meter (Mark)" min="0">

<button type="submit">Calculate & Save</button>

</form>

<div id="output"></div>
<div id="undoBox"></div>

<h3>📜 History</h3>
<div id="history"></div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyCQXv0_MS3aSt0eAVjF7K0197eCrigb0is",
    authDomain: "sub-meter-calculator-6875f.firebaseapp.com",
    projectId: "sub-meter-calculator-6875f",
    storageBucket: "sub-meter-calculator-6875f.appspot.com",
    messagingSenderId: "1096909978301",
    appId: "1:1096909978301:web:41195a8b49133cadba15d4"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* LOAD HISTORY */
window.loadHistory = async function () {
    const snap = await getDocs(collection(db, "history"));

    let html = "";

    snap.forEach(d => {
        const data = d.data();

        html += `
<div class="record">
📅 ${data.date}<br>
⚡ Price: ₱${data.pricePerKWH.toFixed(2)}<br>
🔌 Melissa: ${data.melissaKWH} - ₱${data.melissaCost}<br>
🔌 Mark: ${data.markKWH} - ₱${data.markCost}<br>
🔢 New Meter (Melissa): ${data.newMelissa ?? "N/A"}<br>
🔢 New Meter (Mark): ${data.newMark ?? "N/A"}<br>
🔌 Segundina: ${data.segKWH} - ₱${data.segCost}
</div>`;
    });

    document.getElementById("history").innerHTML = html;
};

/* CALCULATE */
window.calculate = async function () {

    let totalKWH = parseFloat(document.getElementById("totalKWH").value);
    let totalAmount = parseFloat(document.getElementById("totalAmount").value);
    let oldM = parseFloat(document.getElementById("oldM").value);
    let newM = parseFloat(document.getElementById("newM").value);
    let oldMark = parseFloat(document.getElementById("oldMark").value);
    let newMark = parseFloat(document.getElementById("newMark").value);

    let date = new Date().toLocaleDateString();
    let pricePerKWH = totalAmount / totalKWH;

    let melissaKWH = Math.abs(newM - oldM);
    let melissaCost = melissaKWH * pricePerKWH;

    let markKWH = 0;
    let markCost = 0;

    if (!isNaN(oldMark) && !isNaN(newMark)) {
        markKWH = Math.abs(newMark - oldMark);
        markCost = markKWH * pricePerKWH;
    }

    let usedKWH = melissaKWH + markKWH;

    if (usedKWH > totalKWH) {
        alert("Error: Sub-meters exceed total KWH!");
        return;
    }

    let segKWH = totalKWH - usedKWH;
    let segCost = totalAmount - (melissaCost + markCost);

    document.getElementById("output").innerHTML = `
        <b>Price per KWH:</b> ₱${pricePerKWH.toFixed(2)}<br><br>
        <b>Melissa:</b> ${melissaKWH.toFixed(2)} kWh - ₱${melissaCost.toFixed(2)}<br>
        <b>Mark:</b> ${markKWH.toFixed(2)} kWh - ₱${markCost.toFixed(2)}<br>
        <b>Segundina:</b> ${segKWH.toFixed(2)} kWh - ₱${segCost.toFixed(2)}
    `;

    /* =========================
       ⏳ 5-SECOND SAVE / DELETE FEATURE (ADDED ONLY)
    ========================= */

    let countdown = 5;
    let saved = false;

    document.getElementById("undoBox").innerHTML = `
        <button id="saveBtn" style="background:green;">SAVE (${countdown})</button>
        <button id="deleteBtn" style="background:red;">DELETE</button>
    `;

    const timer = setInterval(() => {
        countdown--;
        const btn = document.getElementById("saveBtn");
        if (btn) btn.innerText = `SAVE (${countdown})`;

        if (countdown <= 0) {
            clearInterval(timer);
            if (!saved) {
                document.getElementById("undoBox").innerHTML = "❌ NOT SAVED";
            }
        }
    }, 1000);

    document.getElementById("saveBtn").onclick = async () => {
        saved = true;
        clearInterval(timer);

        await addDoc(collection(db, "history"), {
            date,
            pricePerKWH,
            melissaKWH,
            melissaCost,
            markKWH,
            markCost,
            segKWH,
            segCost,
            newMelissa: newM,
            newMark: newMark
        });

        document.getElementById("undoBox").innerHTML = "✅ SAVED";
        loadHistory();
    };

    document.getElementById("deleteBtn").onclick = () => {
        saved = false;
        clearInterval(timer);
        document.getElementById("undoBox").innerHTML = "🗑️ DELETED (NOT SAVED)";
    };
};

/* THEME */
window.toggleMode = function () {
    document.body.classList.toggle("light-mode");
};

loadHistory();
</script>

</body>
</html>
